services:
  - type: web
    name: agrinex-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DATA_GOV_IN_RESOURCE_ID
        value: 9ef84268-d588-465a-a308-a864a43d0070
      - key: OPEN_METEO_BASE_URL
        value: https://api.open-meteo.com
      - key: DATA_GOV_IN_BASE_URL
        value: https://api.data.gov.in
      - key: GEOCODING_BASE_URL
        value: https://geocoding-api.open-meteo.com
      - key: LOG_LEVEL
        value: INFO
      - key: LGD_SNAPSHOT_PATH
        value: ../knowledge-base/locations_snapshot.json
